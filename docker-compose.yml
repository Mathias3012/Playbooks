version: '3.8'

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: awx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - awx

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: awx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: awx
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: awxpass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - awx

  # AWX Web
  awx-web:
    image: quay.io/ansible/awx:24.3.1
    container_name: awx_web
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    environment:
      - SECRET_KEY=aabbcc
      - DATABASE_NAME=awx
      - DATABASE_USER=awx
      - DATABASE_PASSWORD=awxpass
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWX_ADMIN_USER=admin
      - AWX_ADMIN_PASSWORD=password
    volumes:
      - awx_projects:/var/lib/awx/projects:rw
      - awx_job_status:/var/lib/awx/job_status:rw
    ports:
      - "8080:8052"
    networks:
      - awx

  # AWX Task
  awx-task:
    image: quay.io/ansible/awx:24.3.1
    container_name: awx_task
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - awx-web
    environment:
      - SECRET_KEY=aabbcc
      - DATABASE_NAME=awx
      - DATABASE_USER=awx
      - DATABASE_PASSWORD=awxpass
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWX_ADMIN_USER=admin
      - AWX_ADMIN_PASSWORD=password
    volumes:
      - awx_projects:/var/lib/awx/projects:rw
      - awx_job_status:/var/lib/awx/job_status:rw
    networks:
      - awx
    user: "0"
    command: /usr/bin/launch_awx_task.sh

networks:
  awx:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  awx_projects:
  awx_job_status: 