version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: awx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: awx
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: awxpass123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - awx_network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: awx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - awx_network

  awx-web:
    image: quay.io/ansible/awx:24.3.1
    container_name: awx_web
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_NAME=awx
      - DATABASE_USER=awx
      - DATABASE_PASSWORD=awxpass123
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=awxsecretkey123456789012345678901234567890
      - AWX_ADMIN_USER=admin
      - AWX_ADMIN_PASSWORD=password123
      - DJANGO_SUPERUSER_PASSWORD=password123
    volumes:
      - awx_projects:/var/lib/awx/projects:rw
      - awx_job_status:/var/lib/awx/job_status:rw
    ports:
      - "8080:8052"
    networks:
      - awx_network
    command: >
      bash -c "
        echo 'Esperando a que PostgreSQL esté listo...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'PostgreSQL está listo!' &&
        awx-manage migrate --noinput &&
        echo 'Migraciones completadas' &&
        awx-manage collectstatic --noinput &&
        echo 'Archivos estáticos recolectados' &&
        echo \"from django.contrib.auth.models import User; User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@localhost', 'password123')\" | awx-manage shell &&
        echo 'Usuario admin creado/verificado' &&
        supervisord -c /etc/supervisord.conf
      "

  awx-task:
    image: quay.io/ansible/awx:24.3.1
    container_name: awx_task
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - awx-web
    environment:
      - DATABASE_NAME=awx
      - DATABASE_USER=awx
      - DATABASE_PASSWORD=awxpass123
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=awxsecretkey123456789012345678901234567890
    volumes:
      - awx_projects:/var/lib/awx/projects:rw
      - awx_job_status:/var/lib/awx/job_status:rw
    networks:
      - awx_network
    user: "0"
    command: /usr/bin/launch_awx_task.sh

networks:
  awx_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  awx_projects:
    driver: local
  awx_job_status:
    driver: local 